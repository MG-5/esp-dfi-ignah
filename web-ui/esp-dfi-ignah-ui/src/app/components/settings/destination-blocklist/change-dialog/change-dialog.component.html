@if (action === 'Add') {
<h1 mat-dialog-title>Ziel hinzufügen</h1>
} @else {
<h1 mat-dialog-title>Ziel bearbeiten</h1>
}

<mat-dialog-content>
  <form [formGroup]="destinationForm">
    <mat-form-field>
      <mat-label>Ziel</mat-label>
      <input matInput formControlName="destination">
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions [align]="'end'">
  <button mat-button mat-dialog-close>Abbrechen</button>
  @if (action === 'Add') {
  <button mat-flat-button color="primary" [disabled]="destinationForm.invalid"
    (click)="addDestination()">Hinzufügen</button>
  } @else {

  <button mat-flat-button color="primary" [disabled]="destinationForm.invalid"
    (click)="editDestination()">Speichern</button>

  }
</mat-dialog-actions>
